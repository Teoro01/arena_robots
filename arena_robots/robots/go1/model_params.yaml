robot_model: go1
priority: 2
base_frame: base
z_offset: 0.32
mass:
  base_kg: 12.013
sensors:
  - name: camera_face_image
    type: image
    topic: ${namespace}/camera_face/image
    frame: camera_face
    sensor: camera_face
  - name: camera_face_info
    type: camera_info
    topic: ${namespace}/camera_face/camera_info
    frame: camera_face
    sensor: camera_face
  - name: camera_face_points
    type: pointcloud
    topic: ${namespace}/camera_face/points
    frame: camera_face
    sensor: camera_face
  # Only the front (face) camera is active for now. The chin/left/right/rearDown
  # sensors are commented out to save render cost; re-enable alongside the xacro
  # instantiations + mappings.yaml bridges.
