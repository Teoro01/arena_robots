  # - name: camera_rearDown_points
  #   type: pointcloud
  #   topic: ${namespace}/camera_rearDown/points
  #   frame: camera_optical_rearDown
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
    sensor: gpu_lidar
control:
  mode: ros2_control
  config: package://arena_robots/robots/go1/control.yaml
  controllers:
    - joint_state_broadcaster
    - joint_group_position_controller
  # CHAMP consumes the raw cmd_vel (Twist) directly, so the stamped output is
  # unused; the leg joints are driven by the locomotion sidecar, not cmd_vel.
  cmd_vel_topic: cmd_vel_stamped
  odom_topic: odom
