  #   frame: camera_optical_right
  # - name: camera_rearDown_image
  #   type: image
  #   topic: ${namespace}/camera_rearDown/image
  #   frame: camera_optical_rearDown
  # - name: camera_rearDown_info
  #   type: camera_info
  #   topic: ${namespace}/camera_rearDown/camera_info
