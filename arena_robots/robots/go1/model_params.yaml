  #   type: image
  #   topic: ${namespace}/camera_chin/image
  #   frame: camera_optical_chin
  # - name: camera_chin_info
  #   type: camera_info
  #   topic: ${namespace}/camera_chin/camera_info
  #   frame: camera_optical_chin
  # - name: camera_chin_points
  #   type: pointcloud
  #   topic: ${namespace}/camera_chin/points
  #   frame: camera_optical_chin
  # - name: camera_left_image
  #   type: image
  #   topic: ${namespace}/camera_left/image
  #   frame: camera_optical_left
  # - name: camera_left_info
  #   type: camera_info
  #   topic: ${namespace}/camera_left/camera_info
  #   frame: camera_optical_left
  # - name: camera_left_points
  #   type: pointcloud
  #   topic: ${namespace}/camera_left/points
