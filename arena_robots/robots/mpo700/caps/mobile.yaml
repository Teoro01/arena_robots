odom_frame: odom
sensor_frame: front_laser_link
radius: 0.45
is_holonomic: true

velocity_limits:
  linear: [-0.8, 0.8]
  angular: [-1.0, 1.0]
  lateral: [-0.8, 0.8]

footprint: [[0.37, 0.255], [0.37, -0.255], [-0.37, -0.255], [-0.37, 0.255]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]
    action_type: stop
    min_points: 3
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

planar:
  velocity: {linear: [-.inf, .inf], lateral: [-.inf, .inf], angular: [-.inf, .inf]}
  acceleration: {linear: .inf, lateral: .inf, angular: .inf}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 9.81
  pivot: 0.0
  timeout: 0.5

actions:
  continuous:
    linear:
      min: -0.8
      max: 0.8
    angular:
      min: -1.0
      max: 1.0
  discrete:
    - {name: move_forward,  linear: 0.3,  angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left,     linear: 0.0,  angular: 0.5}
    - {name: turn_right,    linear: 0.0,  angular: -0.5}
    - {name: strafe_left,   linear: 0.0,  lateral: 0.3,  angular: 0.0}
    - {name: strafe_right,  linear: 0.0,  lateral: -0.3, angular: 0.0}
    - {name: stop,          linear: 0.0,  angular: 0.0}

laser:
  angle:
    increment: 0.00872665
    max: 2.3561945
    min: -2.3561945
  num_beams: 541
  range: 30.0
  update_rate: 25
