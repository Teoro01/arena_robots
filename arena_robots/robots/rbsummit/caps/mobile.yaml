odom_frame: odom
sensor_frame: robot_top_3d_laser_link
radius: 0.61

footprint: [[0.5, 0.35], [0.5, -0.35], [-0.5, -0.35], [-0.5, 0.35]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.5, 0.35], [0.5, -0.35], [-0.5, -0.35], [-0.5, 0.35]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-3.0, 3.0]
  angular: [-3.0, 3.0]

planar:
  velocity: {linear: [-1.0, 1.0], lateral: [0.0, 0.0], angular: [-1.0, 1.0]}
  acceleration: {linear: 1.0, lateral: .inf, angular: 1.0}
  gain: {linear: 0.98, lateral: 1.0, angular: 1.11}
  lag: 0.0
  traction: 8.83
  pivot: -0.229
  timeout: 0.25

actions:
  continuous:
    linear:
      min: -2.0
      max: 2.0
    angular:
      min: -4.0
      max: 4.0
  discrete:
  - angular: 0.0
    linear: 0.3
    name: move_forward
  - angular: 0.0
    linear: -0.15
    name: move_backward
  - angular: 0.35
    linear: 0.15
    name: turn_left
  - angular: -0.35
    linear: 0.15
    name: turn_right
  - angular: 0.75
    linear: 0.0
    name: turn_strong_left
  - angular: -0.75
    linear: 0.0
    name: turn_strong_right
  - angular: 0.0
    linear: 0.0
    name: stop
laser:
  angle:
    increment: 0.0034906585
    max: 3.14159265
    min: -3.14159265
  num_beams: 1800
  range: 150.0
  update_rate: 10
