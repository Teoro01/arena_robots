prefix: "robot_"
mounts:
  front:
    parent: base_link
    xyz: [0.42109, -0.32737, 0.16037]
    rpy: [0, -3.141592653589793, 2.356194490192345]
    accepts: [lidar]
    frame: front_laser
  rear:
    parent: base_link
    xyz: [-0.42109, 0.32737, 0.16037]
    rpy: [0, -3.141592653589793, -0.7853981633974483]
    accepts: [lidar]
    frame: rear_laser
  imu:
    parent: base_link
    xyz: [0.127, -0.129, 0.212]
    rpy: [0, 0, 0]
    accepts: [imu]
    frame: vectornav
  front_cam:
    parent: base_link
    xyz: [0.3585, 0.0, 0.25062]
    rpy: [0, 0, 0]
    accepts: [camera]
    frame: front_rgbd_camera
  arm_mount:
    parent: "top_cover"
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    accepts: [arm]
    frame: arm
  wrist_cam:
    parent: "@arm_mount:tip"
    xyz: [0.0, -0.04, 0.03]
    rpy: [0, -1.5708, 1.5708]
    accepts: [camera]
    frame: wrist_rgbd_camera
  arm_base_cam:
    parent: top_cover
    xyz: [-0.25, 0.0, 0.40]
    rpy: [0.0, 0.5236, 0.0]
    accepts: [camera]
    frame: arm_base_rgbd_camera
  

defaults:
  arm:
    - variant: ur5e
      mount: arm_mount
  lidar:
    - variant: sick_s300
      mount: front
      overrides: {topic: lidar}
    - variant: sick_s300
      mount: rear
      overrides: {name: lidar_rear, topic: lidar/rear}
  imu:
    - variant: vectornav
      mount: imu
  camera:
    - variant: d435_color
      mount: front_cam
      overrides: {name: rgbd_camera, topic: rgbd_camera, node_name: front_camera}
    - variant: d435_color
      mount: wrist_cam
      overrides: {name: wrist_camera, topic: wrist_camera, node_name: wrist_camera}
    - variant: d435_color
      mount: arm_base_cam
      overrides: {name: arm_base_camera, topic: arm_base_camera, node_name: arm_base_camera}
