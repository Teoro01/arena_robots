odom_frame: odom
sensor_frame: robot_front_laser_link
radius: 0.4
is_holonomic: true

footprint: [[0.2, 0.3], [0.2, -0.3], [-0.2, -0.3], [-0.2, 0.3]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.2, 0.3], [0.2, -0.3], [-0.2, -0.3], [-0.2, 0.3]]
    action_type: stop
    min_points: 4

actions:
  continuous:
    linear: {min: -2.0, max: 2.0}
    angular: {min: -4.0, max: 4.0}
  discrete:
    - {name: move_forward, linear: 0.3, angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left, linear: 0.0, angular: 2.0}
    - {name: turn_right, linear: 0.0, angular: -2.0}
    - {name: stop, linear: 0.0, angular: 0.0}

laser:
  angle:
    increment: 0.00654497222
    max: 2.35619
    min: -2.35619
  num_beams: 270
  range: 30.0
  update_rate: 10

nav2: {}
