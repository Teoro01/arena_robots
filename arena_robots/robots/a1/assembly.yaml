# prefix: "" because champ config, control.yaml and caps reference the unprefixed names.
prefix: ""
mounts:
  top:
    parent: trunk
    xyz: [0.0, 0.0, 0.083]
    rpy: [0, 0, 0]
    accepts: [lidar]
    frame: lidar
  face:
    parent: trunk
    xyz: [0.271, 0.0125, 0.0167]
    rpy: [0, 0, 0]
    accepts: [camera]
defaults:
  camera:
    - variant: a1_depth
      mount: face
  lidar:
    - variant: arena_default_3d
      mount: top
