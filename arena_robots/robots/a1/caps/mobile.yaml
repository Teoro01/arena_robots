odom_frame: odom
sensor_frame: lidar
radius: 0.30
is_holonomic: true
climbs: [stairs]

footprint: [[0.16, 0.11], [0.16, -0.11], [-0.16, -0.11], [-0.16, 0.11]]
footprint_padding: 0.19

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.16, 0.11], [0.16, -0.11], [-0.16, -0.11], [-0.16, 0.11]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-0.5, 0.5]
  angular: [-1.0, 1.0]

acceleration_limits:
  linear: 2.0
  angular: 3.0

planar:
  velocity: {linear: [-0.5, 0.5], lateral: [-0.25, 0.25], angular: [-1.0, 1.0]}
  acceleration: {linear: .inf, lateral: .inf, angular: .inf}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.25
  traction: .inf
  pivot: 0.0
  timeout: 0.5

actions:
  continuous:
    linear:
      min: -0.5
      max: 0.5
    angular:
      min: -1.0
      max: 1.0
  discrete:
    - angular: 0.0
      linear: 0.3
      name: move_forward
    - angular: 0.0
      linear: -0.15
      name: move_backward
    - angular: 0.35
      linear: 0.15
      name: turn_left
    - angular: -0.35
      linear: 0.15
      name: turn_right
    - angular: 0.75
      linear: 0.0
      name: turn_strong_left
    - angular: -0.75
      linear: 0.0
      name: turn_strong_right
    - angular: 0.0
      linear: 0.0
      name: stop

laser:
  angle:
    increment: 0.009817477
    max: 3.14159
    min: -3.14159
  num_beams: 640
  range: 12.0
  update_rate: 10

nav2:
  local_observation:
    min_obstacle_height: 0.2
  global_observation:
    include: [lidar_points]
    min_obstacle_height: 0.2
    obstacle_max_range: 5.0
    raytrace_max_range: 12.0
