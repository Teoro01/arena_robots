  acceleration: {linear: 10.0, lateral: 10.0, angular: 20.0}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 9.81
  pivot: 0.0
  timeout: 0.5

actions:
  continuous:
    linear:
      min: -2.0
      max: 2.0
    angular:
      min: -4.0
      max: 4.0
  discrete:
  - angular: 0.0
    linear: 0.3
    name: move_forward
  - angular: 0.0
    linear: -0.15
    name: move_backward
  - angular: 0.35
    linear: 0.15
    name: turn_left
  - angular: -0.35
    linear: 0.15
    name: turn_right
  - angular: 0.75
    linear: 0.0
    name: turn_strong_left
  - angular: -0.75
    linear: 0.0
    name: turn_strong_right
  - angular: 0.0
    linear: 0.0
    name: stop

laser:
  angle:
    increment: 0.00174532925
    max: 2.39982772
    min: -2.39982772
  num_beams: 2751
  range: 64.0
  update_rate: 33
