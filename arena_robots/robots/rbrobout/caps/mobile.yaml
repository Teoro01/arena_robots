odom_frame: odom
sensor_frame: robot_front_laser_link
radius: 0.61
is_holonomic: false

footprint: [[0.5, 0.35], [0.5, -0.35], [-0.5, -0.35], [-0.5, 0.35]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.5, 0.35], [0.5, -0.35], [-0.5, -0.35], [-0.5, 0.35]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-1.1, 1.1]
  angular: [-3.0, 3.0]

planar:
