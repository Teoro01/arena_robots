robot_model: turtlebot
priority: 1
base_frame: base_link
z_offset: -0.0045
mass:
  base_kg: 4.153
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: rplidar_link
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: rplidar_link
    sensor: gpu_lidar
  - name: oakd_imu
    type: imu
    topic: ${namespace}/oakd/imu/data
    frame: oakd_imu_frame
    sensor: oakd_imu
  - name: oakd_info
    type: camera_info
    topic: ${namespace}/oakd/camera_info
    frame: oakd_rgb_camera_frame
    sensor: oakd
  - name: oakd_depth
    type: depth
    topic: ${namespace}/oakd/depth_image
    frame: oakd_rgb_camera_frame
    sensor: oakd
  - name: oakd_image
    type: image
    topic: ${namespace}/oakd/image
    frame: oakd_rgb_camera_frame
    sensor: oakd
  - name: oakd_points
    type: pointcloud
    topic: ${namespace}/oakd/points
    frame: oakd_rgb_camera_frame
    sensor: oakd
control:
  mode: ros2_control
  config: package://arena_robots/robots/turtlebot/control.yaml
  controllers:
    - joint_state_broadcaster
    - turtlebot_velocity_controller
  cmd_vel_topic: turtlebot_velocity_controller/cmd_vel
  odom_topic: turtlebot_velocity_controller/odom
