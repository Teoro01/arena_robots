# MoveIt planning joint_limits for arm/ur variant ur15. max_velocity from
# ur_description config/ur15 (the URDF/controller limits); max_acceleration is
# the family's uniform planning cap (UR publishes no accel limits). Keys templated
# ${prefix}${mount}_*, re-keyed per placement by moveit_factory.py.
