variants: [ur3, ur3e, ur5, ur5e, ur7e, ur8long, ur10, ur10e, ur12e, ur15, ur16e, ur18, ur20, ur30]

xacro:
  include: "$(find ur_description)/urdf/ur_macro.xacro"
  macro: ur_robot
  attach:
    tf_prefix: "${prefix}${mount}_"
    name: "${variant}"
    parent: "${prefix}${parent}"
    joint_limits_parameters_file: "$(find ur_description)/config/${variant}/joint_limits.yaml"
    kinematics_parameters_file: "$(find ur_description)/config/${variant}/default_kinematics.yaml"
    physical_parameters_file: "$(find ur_description)/config/${variant}/physical_parameters.yaml"
    visual_parameters_file: "$(find ur_description)/config/${variant}/visual_parameters.yaml"
    sim_gazebo: "${gazebo_classic}"
    sim_ignition: "${gazebo_ignition}"
    safety_limits: "${safety_limits:-false}"
  args:
    safety_limits: false

frames:
  tip: "${prefix}${mount}_tool0"

ros2_control:
  joints:
    - name: "${prefix}${mount}_shoulder_pan_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_shoulder_lift_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_elbow_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_1_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_2_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_3_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]

# control params must stay in sync with robots/rbvogui_plus/control.yaml's arm_controller
# section (maintained there, not derived from this component).
control:
  controller: "${mount}_controller"
  type: joint_trajectory_controller/JointTrajectoryController
  ros__parameters:
    joints:
      - "${prefix}${mount}_shoulder_pan_joint"
      - "${prefix}${mount}_shoulder_lift_joint"
      - "${prefix}${mount}_elbow_joint"
      - "${prefix}${mount}_wrist_1_joint"
      - "${prefix}${mount}_wrist_2_joint"
      - "${prefix}${mount}_wrist_3_joint"
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

# workspace/named_poses must stay in sync with robots/rbvogui_plus/caps/arm.yaml
# (maintained there, not derived from this component).
caps:
  base_link: "${prefix}${parent}"
  tip_link: "${prefix}${mount}_tool0"
  chain:
    - "${prefix}${mount}_shoulder_pan_joint"
    - "${prefix}${mount}_shoulder_lift_joint"
    - "${prefix}${mount}_elbow_joint"
    - "${prefix}${mount}_wrist_1_joint"
    - "${prefix}${mount}_wrist_2_joint"
    - "${prefix}${mount}_wrist_3_joint"
  controller: "${mount}_controller"
  moveit:
    package: ur_moveit_config
    planning_group: "${mount}_manipulator"
    srdf:
      package: arena_robots
      path: components/arm/ur/srdf/ur.srdf.xacro
    joint_limits:
      package: arena_robots
      path: components/arm/ur/joint_limits/${variant}.yaml
    args:
      ur_type: "${variant}"
      prefix: "${prefix}"
      safety_limits: true
      mount: "${mount}"
      parent: "${parent}"
  workspace:
    type: box
    frame: "${prefix}${parent}"
    min: [0.2, -0.5, 0.2]
    max: [0.7, 0.5, 1.0]
  named_poses:
    stow:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -1.57
        "${prefix}${mount}_elbow_joint": 1.57
        "${prefix}${mount}_wrist_1_joint": -1.57
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    ready:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -1.0
        "${prefix}${mount}_elbow_joint": 1.0
        "${prefix}${mount}_wrist_1_joint": -1.5
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    wave_up:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    wave_l:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": -0.6
    wave_r:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.6
power:
  static_power_w: 50.0
