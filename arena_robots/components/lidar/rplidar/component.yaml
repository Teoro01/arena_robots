xacro:
  include: "$(find arena_robots)/components/lidar/rplidar/rplidar.urdf.xacro"
  macro: rplidar
  attach:
    name: "${mount}"
    parent_link: "${prefix}${parent}"
    gazebo: "true"
  args: {}
sensor:
  gz:
    - name: "${name:-lidar}"
      type: laserscan
      topic: "${topic:-lidar}"
      frame: "${prefix}${mount}_link"
      sensor: gpu_lidar
    - name: "${name:-lidar}_points"
      type: pointcloud
      topic: "${topic:-lidar}/points"
      frame: "${prefix}${mount}_link"
      sensor: gpu_lidar
power:
  static_power_w: 3.0
