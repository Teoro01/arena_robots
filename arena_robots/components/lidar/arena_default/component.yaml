# the macro's z_offset is folded into the mount's xyz here (Mount owns
# placement), not exposed as a separate arg.
xacro:
  include: "$(find arena_robots)/components/lidar/arena_default/lidar.urdf.xacro"
  macro: arena_default_lidar_mount
  attach:
    parent_link: "${prefix}${parent}"
    frame: "${frame:-lidar}"
    update_rate: "${update_rate:-10}"
    samples: "${samples:-720}"
    min_angle: "${min_angle:--3.14159}"
    max_angle: "${max_angle:-3.14159}"
    min_range: "${min_range:-0.1}"
    max_range: "${max_range:-30.0}"
  args:
    frame: lidar
    update_rate: 10
    samples: 720
    min_angle: -3.14159
    max_angle: 3.14159
    min_range: 0.1
    max_range: 30.0
sensor:
  gz:
    - name: "${name:-lidar}"
      type: laserscan
      topic: "${topic:-lidar}"
      frame: "${frame:-lidar}"
      sensor: gpu_lidar
    - name: "${name:-lidar}_points"
      type: pointcloud
      topic: "${topic:-lidar}/points"
      frame: "${frame:-lidar}"
      sensor: gpu_lidar
power:
  static_power_w: 5.0
