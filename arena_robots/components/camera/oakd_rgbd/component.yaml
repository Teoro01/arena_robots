xacro:
  include: "$(find arena_robots)/components/camera/oakd_rgbd/oakd_rgb.urdf.xacro"
  macro: oakd
  attach:
    name: "${camera:-${mount}}"
    parent_link: "${prefix}${parent}"
    model: "${model:-pro}"
  args:
    model: pro
# Output order matches model_params.yaml (imu before rgbd outputs):
# TestEffectiveSensorsMatchModelParams is order-sensitive.
sensor:
  gz:
    - name: "${imu_name:-${mount}}_imu"
      type: imu
      topic: "rgbd_camera/${topic:-${mount}}/imu/data"
      frame: "${prefix}${mount}_imu_frame"
      sensor: "${name:-${mount}}_imu"

    - name: "${name:-${mount}}_info"
      type: camera_info
      topic: "rgbd_camera/${topic:-${mount}}/camera_info"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${name:-${mount}}"

    - name: "${name:-${mount}}_depth"
      type: depth
      topic: "rgbd_camera/${topic:-${mount}}/depth_image"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${name:-${mount}}"

    - name: "${name:-${mount}}_image"
      type: image
      topic: "rgbd_camera/${topic:-${mount}}/image"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${name:-${mount}}"

    - name: "${name:-${mount}}_points"
      type: pointcloud
      topic: "rgbd_camera/${topic:-${mount}}/points"
      frame: "${prefix}${mount}_rgb_camera_frame"
      sensor: "${name:-${mount}}"
power:
  static_power_w: 3.5
