[project]
name = "arena_robots"
version = "0.1.0"
dependencies = [
    "attrs",
    "pyyaml",
]
requires-python = "==3.12.*"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["deps", ".git", ".venv", "build", "install", "log"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]

